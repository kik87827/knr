<!DOCTYPE html>
<html lang="ko">

<head>
	<meta http-equiv="Content-Type" content="text/html;  charset=utf-8" />
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=1440" />
	<link href="./assets/css/reset.css" rel="stylesheet" />
	<link href="./assets/css/webfont.css" rel="stylesheet" />
	<link href="./assets/css/layout.css" rel="stylesheet" />
	<link href="./assets/css/contents.css" rel="stylesheet" />
	<title></title>
</head>

<body>
	<!-- login -->
	<div class="entrance_page">
		<div class="entrance_img_cols">
			<div class="bg_img"><img src="./assets/images/login/display_image.jpg" alt="" /></div>
			<div class="entrance_catchphrase_group">
				<p class="sub_catchphrase">Beyond Railways, Building Tomorrow</p>
				<div class="main_catchphrase_group">
					<p class="main_catchphrase">우리는 길을 만드는 일을 넘어,</p>
					<p class="main_catchphrase">세상의 가능성을 확장합니다.</p>
				</div>
			</div>
		</div>
		<div class="entrance_form_cols">
			<div class="entrance_form_cluster">
				<div class="top_items">
					<div class="logo_row"><img src="./assets/images/login/login_logo.png" alt="" /></div>
					<div class="title_row">
						<h1 class="main_title">스마트 안전관리 통합서비스</h1>
						<p class="sub_title_copy">이메일 주소와 비밀번호를 입력해주세요.</p>
					</div>
				</div>
				<div class="middle_items">
					<div class="entrance_form_group">
						<div class="entrance_form_block">
							<div class="label_row">
								<p class="label_text_node">이메일 주소</p>
							</div>
							<div class="form_row">
								<div class="feed_input_wrap">
									<input type="text" class="feed_input" placeholder="이메일 주소를 입력하세요" />
								</div>
							</div>
						</div>
						<div class="entrance_form_block">
							<div class="label_row">
								<p class="label_text_node">비밀번호</p>
							</div>
							<div class="form_row">
								<div class="feed_input_wrap">
									<input type="password" class="feed_input" placeholder="비밀번호를 입력하세요" />
									<div class="feed_else_cols">
										<button class="button_role shape_eye"></button>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="entrance_props_wrap">
						<div class="props_obj">
							<input type="checkbox" class="props_element" id="save_email" />
							<label for="save_email" class="props_lbtext">이메일 저장하기</label>
						</div>
					</div>
					<div class="entrance_btn_wrap">
						<a href="#" class="btn_request_box"><span class="text_node">로그인</span></a>
					</div>
					<div class="entrance_etc_wrap">
						<ul class="menu_piece_list">
							<li><a href="#" class="menu_piece_item">비밀번호 찾기</a></li>
							<li><a href="#" class="menu_piece_item">아이디 찾기</a></li>
						</ul>
					</div>
				</div>
			</div>
			<p class="entrance_bottom_copy">ⓒ리스크제로. All Rights Reserved.</p>
		</div>
	</div>
	<!-- // login -->
</body>

</html>
