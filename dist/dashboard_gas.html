<!DOCTYPE html>
<html lang="ko">

<head>
	<meta http-equiv="Content-Type" content="text/html;  charset=utf-8" />
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=1440" />
	<link href="./assets/css/reset.css" rel="stylesheet" />
	<link href="./assets/css/webfont.css" rel="stylesheet" />
	<link href="./assets/css/layout.css" rel="stylesheet" />
	<link href="./assets/css/contents.css" rel="stylesheet" />
	<title></title>
</head>

<body style="background: #ecf3f2">
	<div style="display: flex; flex-direction: column; min-height: 100vh">
		<div style="background: #29303d; height: 114px; flex: 0 0 114px"></div>
		<div style="flex: 1; padding: 20px 35px; display: flex; gap: 27px">
			<div style="background: #fff; flex: 0 0 280px; border-radius: 10px; box-shadow: 0px 2px 5px 0px rgba(84, 107, 104, 0.16); border: 1px solid rgb(219, 224, 232)"></div>
			<div style="flex: 1">
				<!-- contents -->
				<div class="contents_title_row">
					<div class="main_cols">
						<h2 class="contents_title">가스센서관제</h2>
						<p class="contents_title_copy">현장에 설치한 가스센서의 상태를 관제합니다.</p>
					</div>
					<div class="sub_cols">
						<ul class="breadcrumb_list">
							<li class="has_ico">
								<a href="#" class="breadcrumb_item_home"><img src="./assets/images/system/ico_home.png" alt="" /></a>
							</li>
							<li><a href="#" class="breadcrumb_text_node">장비설정</a></li>
							<li><a href="#" class="breadcrumb_text_node">가스센서관리</a></li>
							<li><a href="#" class="breadcrumb_text_node highlight">가스센서관제</a></li>
						</ul>
					</div>
				</div>
				<div class="contents_box_container">내용이 들어갑니다.</div>
				<!-- // contents -->
			</div>
		</div>
	</div>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			boxtabFunc(); // box tab
			tooltipFunc(); // tooltip
		});

		// box tab
		function boxtabFunc() {
			const boxtab = document.querySelectorAll(".boxtab");
			if (boxtab.length === 0) {
				return;
			}
			boxtab.forEach((eventItem) => {
				eventItem.addEventListener("click", (e) => {
					e.preventDefault();
					const eTarget = e.currentTarget;
					const eTargetNot = eTarget.closest(".boxtab_list").querySelector(".boxtab.active");
					const eCont = document.querySelector(eTarget.getAttribute("href"));
					const eContNot = eCont.closest(".boxtab_cont_group").querySelector(".boxtab_cont.active");

					if (!!eTargetNot) {
						eTargetNot.classList.remove("active");
					}
					eTarget.classList.add("active");

					if (!!eContNot) {
						eContNot.classList.remove("active");
					}
					eCont.classList.add("active");
				});
			});
		}
		// tooltip
		function tooltipFunc() {
			const btn_tooltip = document.querySelectorAll(".btn_tooltip");
			const tooltip_layer_active = document.querySelectorAll(".tooltip_layer.active");
			if (btn_tooltip.length === 0) {
				return;
			}
			btn_tooltip.forEach((eachTarget) => {
				eachTarget.addEventListener("click", (e) => {
					const thisEvent = e.currentTarget;
					const thisTarget = document.querySelector(thisEvent.dataset.target);
					const thisTargetPointer = thisTarget.querySelector(".tooltip_pointer");
					const thisParent = document.querySelector(thisEvent.dataset.zone);
					const thisTopValue = thisEvent.offsetTop + thisEvent.getBoundingClientRect().height;
					thisTarget.style.top = thisTopValue + 15 + "px";
					thisTarget.style.left = thisEvent.offsetLeft - 14 + "px";
					thisTarget.classList.toggle("active");

					//thisTargetPointer.style.left = thisEvent.offsetLeft + 1 + "px";
				});
			});
			document.addEventListener("click", (e) => {
				const tooltip_layer_active = document.querySelectorAll(".tooltip_layer.active");
				if (e.target.closest(".btn_tooltip") || e.target.classList.contains("btn_tooltip")) {
					return;
				}
				tooltip_layer_active.forEach((active_item) => {
					active_item.classList.remove("active");
				});
			});
		}
	</script>
</body>

</html>
